name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      # A shallow clone is enough, and that is a property worth keeping. The screenshot
      # freshness gate went through three mechanisms in one day: mtimes (wrong — a fresh
      # checkout writes every file at once), commit dates (unsatisfiable — a surface change
      # that alters no pixel leaves nothing to commit), and now a digest of the surfaces'
      # content written by `pnpm screenshots` itself. Only the first two needed history.
      - uses: actions/checkout@v5

      # No `version:` here on purpose. `pnpm/action-setup` refuses to run when
      # a version is given both here and as `packageManager` in package.json,
      # and it fails at setup — ten seconds in, before a single gate runs.
      # `packageManager` has been in package.json since the first commit, so
      # every CI run this repository has ever had failed that way: a hundred
      # runs, a hundred failures, while the badge nobody looked at said the
      # gates were running. The local pre-push hook covered for it — it runs
      # the same gates and it is why the work was actually green.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # REQ-01 / REQ-08 — boundary and network rules are lint errors, not review notes
      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: build both browser targets
        run: pnpm build

      # Includes the bundle gates in tools/gates: they read what actually
      # ships rather than what the source says, and they fail — never skip —
      # when the build is broken.
      - name: unit tests and bundle gates
        run: pnpm test
        # No `OKOLOS_FEED_KEY` here, and that is the decision rather than an
        # omission. ADR-0002: feeds are signed on the machine that holds the
        # private key, and moving it into CI is the trade it refuses. An earlier
        # pass wired the secret in so the pair test could run on the runner —
        # which would have put the private half on GitHub to satisfy a gate.
        #
        # `tools/feed-key.test.ts` asks a different question here instead, and
        # asserts rather than skips: on CI it proves the key is *absent*.
        # `.githooks/pre-push` runs the whole suite locally, so the pair is
        # checked by the only party that can, before every push.

      - name: upload builds
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: apps/extension/dist
          retention-days: 14

      # REQ-31 — the UX chain must not drift
      - name: ux lint
        run: python3 docs/ux/lint.py

      # The brand pack is the source for every string a user reads, and it went
      # four errors deep while nothing ran it. Warnings print and pass; errors
      # refuse — the mapping is in tools/brand-gate.mjs with its reason.
      - name: brand pack
        run: pnpm brand:lint

      # A sentence the code holds instead of the catalogue is English on a
      # Russian-facing surface. Exemptions are allowed and must carry a reason
      # at the site; this refuses the ones that do not.
      - name: sentences outside the catalogue
        run: pnpm i18n:sweep

      # Before an upload rather than after one: a manifest naming a missing
      # file, a locale that cannot answer a __MSG__, or a build carrying the
      # test hooks that open the shadow roots.
      - name: release checks
        run: pnpm package:check

  # B-164: the same gates on Windows. Nothing here ran on Windows before 2026-10-27, so a
  # contributor on Windows met a hook that could not find python3, tests asserting POSIX file
  # modes and a process-group kill Windows does not have (B-162, B-163), and `okolos-mail scan`
  # exited 0 without scanning (B-161). e2e stays on Linux: the browsers' behaviour is the same,
  # and the Playwright Firefox path is covered by tools/find-firefox.test.ts.
  windows:
    name: gates (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Windows ships no python3; tools/python.mjs finds `py -3` or `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: build both browser targets
        run: pnpm build
      - name: unit tests and bundle gates
        run: pnpm test
      - name: ux lint
        run: pnpm ux:lint
      - name: brand pack
        run: pnpm brand:lint
      - name: sentences outside the catalogue
        run: pnpm i18n:sweep
      - name: release checks
        run: pnpm package:check

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. `pnpm/action-setup` refuses to run when
      # a version is given both here and as `packageManager` in package.json,
      # and it fails at setup — ten seconds in, before a single gate runs.
      # `packageManager` has been in package.json since the first commit, so
      # every CI run this repository has ever had failed that way: a hundred
      # runs, a hundred failures, while the badge nobody looked at said the
      # gates were running. The local pre-push hook covered for it — it runs
      # the same gates and it is why the work was actually green.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      # Extensions only load in a headed persistent context, hence xvfb.
      # `pnpm test:e2e` builds both the shipping artefact and the test-hook one
      # before running: the hook build is what lets a click reach a closed
      # shadow root, and a run against a stale build would pass by testing
      # yesterday's code.
      - name: every scenario, against the built extension
        run: xvfb-run --auto-servernum pnpm test:e2e

      # The answer to the last two CI-only e2e failures was sitting on the runner
      # and being thrown away. `playwright.config.ts` keeps a trace on failure —
      # network, console, DOM snapshots per step — and without this the log's
      # "44 × locator resolved to 0 elements" is all anyone gets, which is how the
      # same class got guessed at twice. Failure-only, so a green run uploads nothing.
      - name: the trace of whatever failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14

  e2e-firefox:
    name: e2e (firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. `pnpm/action-setup` refuses to run when
      # a version is given both here and as `packageManager` in package.json,
      # and it fails at setup — ten seconds in, before a single gate runs.
      # `packageManager` has been in package.json since the first commit, so
      # every CI run this repository has ever had failed that way: a hundred
      # runs, a hundred failures, while the badge nobody looked at said the
      # gates were running. The local pre-push hook covered for it — it runs
      # the same gates and it is why the work was actually green.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox
      - run: pnpm build
      # Both builds, because the runner installs both. The shipping build is
      # where the closed shadow root is checked; the test-hook build is where
      # anything inside it can be reached. This line was missing, and the first
      # CI run that ever reached the Firefox job failed on `dist/firefox-e2e is
      # missing` — invisible locally, where an earlier `pnpm test:e2e` had
      # already left the directory behind.
      - run: pnpm build:e2e

      # geckodriver installs the extension the way Mozilla supports for
      # unpacked builds; the run fails loudly if the add-on is absent, so a
      # browser without it can never produce a green result.
      #
      # No FIREFOX_BINARY here on purpose. It used to name a Playwright build
      # number, which changes on every upgrade and turned an unrelated
      # dependency bump into a red Firefox job — the exact pressure that gets a
      # browser quietly dropped from CI. The runner finds the newest installed
      # build itself and says what to run if there is none.
      - name: scenarios in Firefox
        run: node tools/firefox-e2e.mjs
